<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate My Professor | UKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Lora"', 'Georgia', 'serif'],
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              mono: ['"Space Mono"', 'monospace'],
            },
            colors: {
              ukm: {
                red: '#990000',     // Classic Academic Red
                gold: '#C5A059',    // Gold accent
                blue: '#003366',    // Navy Blue
                gray: '#F4F4F4',    // Light Gray Background
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F8FAFC;
        color: #1E293B;
      }
      /* Clean, Modern Scrollbars - Globally Configured */
      
      /* 1. Global / Light Theme Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
        border: 2px solid #f1f5f9;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* 2. Dark Theme / Dark Session Scrollbars (e.g., Why Rate My Professor Matters section) */
      .bg-slate-900 ::-webkit-scrollbar,
      .bg-slate-950 ::-webkit-scrollbar,
      .bg-slate-800 ::-webkit-scrollbar,
      [class*="bg-slate-9"] ::-webkit-scrollbar,
      #why-it-matters-section ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .bg-slate-900 ::-webkit-scrollbar-track,
      .bg-slate-950 ::-webkit-scrollbar-track,
      .bg-slate-800 ::-webkit-scrollbar-track,
      [class*="bg-slate-9"] ::-webkit-scrollbar-track,
      #why-it-matters-section ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.4);
        border-radius: 9999px;
      }
      .bg-slate-900 ::-webkit-scrollbar-thumb,
      .bg-slate-950 ::-webkit-scrollbar-thumb,
      .bg-slate-800 ::-webkit-scrollbar-thumb,
      [class*="bg-slate-9"] ::-webkit-scrollbar-thumb,
      #why-it-matters-section ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
        border-radius: 9999px;
        border: 1px solid transparent;
        background-clip: padding-box;
      }
      .bg-slate-900 ::-webkit-scrollbar-thumb:hover,
      .bg-slate-950 ::-webkit-scrollbar-thumb:hover,
      .bg-slate-800 ::-webkit-scrollbar-thumb:hover,
      [class*="bg-slate-9"] ::-webkit-scrollbar-thumb:hover,
      #why-it-matters-section ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.45);
      }

      /* Support Firefox scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
      }

      .bg-slate-900 *,
      .bg-slate-950 *,
      .bg-slate-800 *,
      [class*="bg-slate-9"] *,
      #why-it-matters-section * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.25) rgba(15, 23, 42, 0.4);
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>

  </body>
